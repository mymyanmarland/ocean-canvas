<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <path id="twinkle" d="M0,-10 C1.5,-3 3,-1.5 10,0 C3,1.5 1.5,3 0,10 C-1.5,3 -3,1.5 -10,0 C-3,-1.5 -1.5,-3 0,-10 Z"/>
  </defs>
  <!-- wand stick -->
  <rect x="22" y="43" width="46" height="10" rx="5" fill="#e8d5a8" transform="rotate(-45 48 48)"/>
  <circle cx="64" cy="32" r="4" fill="#edf3fb">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <!-- sparkles at tip -->
  <g transform="translate(78,16)"><g opacity="0.9">
    <animateTransform attributeName="transform" type="scale" values="1;1.35;1" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    <use href="#twinkle" fill="#edf3fb"/>
  </g></g>
  <g transform="translate(86,38) scale(0.7)"><g opacity="0.9">
    <animateTransform attributeName="transform" type="scale" values="1;1.4;1" dur="2.1s" begin="-0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.1s" begin="-0.5s" repeatCount="indefinite"/>
    <use href="#twinkle" fill="#45c8f0"/>
  </g></g>
  <g transform="translate(58,12) scale(0.55)"><g opacity="0.9">
    <animateTransform attributeName="transform" type="scale" values="1;1.45;1" dur="1.6s" begin="-1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" begin="-1s" repeatCount="indefinite"/>
    <use href="#twinkle" fill="#e8d5a8"/>
  </g></g>
  <g transform="translate(72,50) scale(0.8)"><g opacity="0.9">
    <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="2.3s" begin="-1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.3s" begin="-1.4s" repeatCount="indefinite"/>
    <use href="#twinkle" fill="#6a8cff"/>
  </g></g>
</svg>
